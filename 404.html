<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 - Not Found | Sobanullah Channa</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Inter',system-ui,sans-serif;background:#0b1120;color:#e2e8f0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:2rem}
    h1{font-size:7rem;font-weight:800;background:linear-gradient(135deg,#06b6d4,#8b5cf6);-webkit-background-clip:text;-webkit-text-fill-color:transparent;line-height:1}
    h2{font-size:1.5rem;margin-bottom:1rem;color:#94a3b8}
    p{color:#64748b;margin-bottom:2rem;max-width:400px}
    a{display:inline-flex;align-items:center;gap:.5rem;padding:12px 28px;border-radius:9999px;background:#06b6d4;color:#fff;text-decoration:none;font-weight:600;transition:all .3s}
    a:hover{transform:translateY(-2px);box-shadow:0 8px 32px rgba(6,182,212,0.3)}
  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet" />
</head>
<body>
  <h1>404</h1>
  <h2>Page not found</h2>
  <p>The page you're looking for doesn't exist or has been moved. Let's get you back on track.</p>
  <a href="/">&larr; Back to Home</a>
</body>
</html>
